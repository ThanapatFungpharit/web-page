[project]
name = "web-page"
version = "0.1.0"
description = "Script a Playwright-compatible page with YAML instead of code."
readme = "README.md"
authors = [
    { name = "ThanapatFungpharit", email = "thanapatsun.pro@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
playwright = ["playwright>=1.63.0"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
    "uv-script>=0.1.9",
]

[tool.uvs.scripts]
format = "ruff format"
lint = "ruff check --fix"
typecheck = "ty check"
test = "pytest"
check = ["format", "lint", "typecheck", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["browser: needs a Playwright Chromium install (uv run playwright install chromium)"]
